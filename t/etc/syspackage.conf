-- diod.conf for t0027-syspackage.t
--
-- The test runs only if /etc/diod.conf is identical to this file, so it
-- cannot touch a real server's configuration.  CI installs it with the
-- diod package and creates the exported directories.
listen = { "/run/diod-test/sock" }
exports = {
    "/var/lib/diod-test/rw",
    { path="/var/lib/diod-test/ro", opts="ro" },
    "ctl",
}
