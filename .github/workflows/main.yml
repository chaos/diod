name: ci

on: [ pull_request, push ]

jobs:
  build:
    runs-on: ${{matrix.os}}

    strategy:
      matrix:
        cc: [gcc, clang]
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            ncurses-dev automake autoconf pkgconf \
            lua5.3 liblua5.3-dev libmunge-dev libcap-dev \
            libattr1-dev rsync dbench attr scrub postmark valgrind \
            munge \
            ${{matrix.cc}}
    - name: start munged
      run: |
        sudo systemctl start munge
        munge -n | unmunge
    - name: Display configuration
      run: |
        echo "C compiler:"
        ${CC} --version
        echo "Kernel:"
        uname -r
        echo "/tmp file system:"
        df /tmp
      env:
        CC: ${{matrix.cc}}
    - name: allow nobody user into home
      run: sudo chmod go+rx ~
    - name: load vsock loopback module for vsock tests
      run: sudo modprobe vsock_loopback || true
    - name: autogen
      run: ./autogen.sh
    - name: configure
      run: ./configure
    - name: make
      run: make
    - name: make check
      run: verbose=t make check
    - name: valgrind some unit tests
      run: scripts/check-valgrind.sh
    - name: sudo some unit tests
      run: scripts/check-root.sh
    - name: make distcheck
      run: make distcheck
    - name: get test results on failure
      if: failure()
      run: scripts/check-logs.sh >&2


  build-alpine:
    name: check on alpine (musl, busybox)
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
      # privileged so the v9fs tests can mount, if the host has 9p
      options: --privileged
    steps:
    - name: Install dependencies
      # git first, so actions/checkout makes a clone that git describe
      # can use for the version.  Alpine has no munge package.
      run: |
        apk add --no-cache \
            git build-base linux-headers automake autoconf pkgconf \
            ncurses-dev libcap-dev attr-dev lua5.3-dev \
            attr rsync sudo
        git config --system --add safe.directory '*'
    - uses: actions/checkout@v7
    - name: Display configuration
      run: |
        cat /etc/alpine-release
        gcc --version
        uname -r
        ls -l /bin/sh
        df /tmp
    - name: create unprivileged user with passwordless sudo
      # The container runs as root, but the tests expect a user with sudo.
      run: |
        adduser -D builder
        echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder
        chown -R builder .
    - name: autogen
      run: su builder -c ./autogen.sh
    - name: configure
      run: su builder -c './configure --disable-auth'
    - name: make
      run: su builder -c make
    - name: make check
      run: su builder -c 'verbose=t make check'
    - name: sudo some unit tests
      run: su builder -c scripts/check-root.sh
    - name: get test results on failure
      if: failure()
      run: scripts/check-logs.sh >&2


  build-deb:
    name: check installed (systemd, deb)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # git describe needs history to version the package
        fetch-depth: 0
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            ncurses-dev automake autoconf pkgconf \
            lua5.4 liblua5.4-dev libmunge-dev libcap-dev \
            libattr1-dev attr munge \
            build-essential devscripts debhelper
    - name: start munged
      run: |
        sudo systemctl start munge
        munge -n | unmunge
    - name: allow nobody user into home
      run: sudo chmod go+rx ~
    - name: autogen
      run: ./autogen.sh
    - name: configure
      run: ./configure
    - name: build the deb
      run: |
        # debbuild.sh puts the git identity in debian/changelog
        git config --global user.name "diod CI"
        git config --global user.email "ci@localhost"
        make deb
    - name: install the deb and start it under systemd
      run: scripts/install-syspackage.sh
    - name: make check
      run: verbose=t make check
    - name: check that t0028 tested the installed diod with no skips
      run: |
        test -f t/t0028-syspackage.log
        if grep -E "^(SKIP|ok .* # skip)" t/t0028-syspackage.log; then
            echo "t0028-syspackage.t skipped tests on this builder" >&2
            exit 1
        fi
    - name: get test results on failure
      if: failure()
      run: |
        scripts/check-logs.sh >&2
        sudo journalctl -u diod --no-pager >&2

  build-rdma:
    name: build-only check for RDMA (experimental)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            ncurses-dev automake autoconf pkgconf \
            lua5.3 liblua5.3-dev libmunge-dev libcap-dev \
            libattr1-dev libibverbs-dev librdmacm-dev gcc
    - name: autogen
      run: ./autogen.sh
    - name: configure
      run: ./configure --enable-rdma
    - name: make
      run: make


  build-minimal:
    name: check minimal configuration
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            ncurses-dev automake autoconf pkgconf \
            libcap-dev libattr1-dev attr
    - name: allow nobody user into home
      run: sudo chmod go+rx ~
    - name: autogen
      run: ./autogen.sh
    - name: configure without auth, config, multiuser, diodmount
      run: ./configure --disable-auth --disable-config --disable-multiuser --disable-diodmount
    - name: make
      run: make
    - name: make check
      run: verbose=t make check
    - name: get test results on failure
      if: failure()
      run: scripts/check-logs.sh >&2
